<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在庫数カウンター（個人用）</title>
<style>
  :root {
    --ink: #2B2823;
    --bg: #F7F5F0;
    --line: #DDD6C8;
    --danger: #B4392F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding-bottom: 90px;
  }
  header {
    padding: 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; font-weight: 700; margin: 0; }
  #saveState { font-size: 11px; color: #8A8272; }
  #saveState.error { color: var(--danger); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px; }
  #resetBtn {
    width: 100%;
    padding: 10px;
    font-size: 14px;
    font-weight: 700;
    border: 1px solid var(--danger);
    color: var(--danger);
    background: #fff;
    border-radius: 4px;
    margin-bottom: 20px;
    cursor: pointer;
  }
  section {
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .section-title {
    padding: 8px 12px;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
  }
  .items { display: grid; grid-template-columns: 1fr; }
  @media (min-width: 480px) {
    .items { grid-template-columns: 1fr 1fr; }
  }
  .item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid rgba(0,0,0,0.07);
  }
  .item-name { font-size: 14px; font-weight: 500; }
  .counter { display: flex; align-items: center; gap: 6px; }
  .counter button {
    width: 28px;
    height: 28px;
    border-radius: 4px;
    border: 1px solid;
    background: #fff;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  .counter button:disabled { opacity: 0.3; cursor: default; }
  .counter input {
    width: 44px;
    text-align: center;
    font-size: 14px;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 4px 0;
  }
  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--bg);
    border-top: 1px solid var(--line);
    padding: 12px 16px;
  }
  footer .wrap { padding: 0; }
  #exportBtn {
    width: 100%;
    padding: 12px;
    font-weight: 700;
    font-size: 14px;
    border: none;
    border-radius: 4px;
    background: var(--ink);
    color: var(--bg);
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>在庫数カウンター（個人用）</h1>
  <span id="saveState"></span>
</header>

<div class="wrap">
  <button id="resetBtn">全てリセット</button>
  <div id="sections"></div>
</div>

<footer>
  <div class="wrap">
    <button id="exportBtn">テキストファイルに出力</button>
  </div>
</footer>

<script>
const SECTIONS = [
  { id: "B", title: "B賞", bg: "#EAF1F7", accent: "#3E6E96",
    items: ["ブクロ", "ヨコハマ", "シブヤ", "シンジュク", "ナゴヤ"] },
  { id: "C", title: "C賞", bg: "#FBF1E6", accent: "#B8763C",
    items: ["一郎","二郎","三郎","左馬刻","銃兎","理鶯","乱数","幻太郎","帝統","寂雷","一二三","独歩","盧笙","空却","十四","獄"] },
  { id: "D", title: "D賞", bg: "#EEF4EA", accent: "#4E7A3E",
    items: ["ブクロ", "ヨコハマ", "シブヤ", "シンジュク", "ナゴヤ"] },
  { id: "E", title: "E賞", bg: "#F3EDF5", accent: "#7A5591",
    items: ["ブクロ","一郎","二郎","三郎","ヨコハマ","左馬刻","銃兎","理鶯","シブヤ","乱数","幻太郎","帝統","シンジュク","寂雷","一二三","独歩","盧笙","ナゴヤ","空却","十四","獄"] },
];

const STORAGE_KEY = "kuji-tally-personal";
let counts = {};

function keyOf(sectionId, item, idx) {
  return sectionId + "__" + idx + "__" + item;
}

function load() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw) counts = JSON.parse(raw);
  } catch (e) {
    counts = {};
  }
}

function save() {
  const el = document.getElementById("saveState");
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(counts));
    el.textContent = "保存済み";
    el.classList.remove("error");
  } catch (e) {
    el.textContent = "保存に失敗しました";
    el.classList.add("error");
  }
}

function render() {
  const container = document.getElementById("sections");
  container.innerHTML = "";
  SECTIONS.forEach((section) => {
    const sec = document.createElement("section");

    const titleDiv = document.createElement("div");
    titleDiv.className = "section-title";
    titleDiv.style.backgroundColor = section.accent;
    titleDiv.textContent = section.title;
    sec.appendChild(titleDiv);

    const itemsDiv = document.createElement("div");
    itemsDiv.className = "items";
    itemsDiv.style.backgroundColor = section.bg;

    section.items.forEach((item, idx) => {
      const k = keyOf(section.id, item, idx);
      const val = counts[k] || 0;

      const row = document.createElement("div");
      row.className = "item-row";

      const nameSpan = document.createElement("span");
      nameSpan.className = "item-name";
      nameSpan.textContent = item;
      row.appendChild(nameSpan);

      const counterDiv = document.createElement("div");
      counterDiv.className = "counter";

      const minusBtn = document.createElement("button");
      minusBtn.textContent = "−";
      minusBtn.style.borderColor = section.accent;
      minusBtn.style.color = section.accent;
      minusBtn.disabled = val <= 0;
      minusBtn.onclick = () => {
        counts[k] = Math.max(0, val - 1);
        save();
        render();
      };
      counterDiv.appendChild(minusBtn);

      const input = document.createElement("input");
      input.type = "text";
      input.inputMode = "numeric";
      input.value = val;
      input.onchange = (e) => {
        const digits = e.target.value.replace(/[^0-9]/g, "");
        counts[k] = digits === "" ? 0 : parseInt(digits, 10);
        save();
        render();
      };
      counterDiv.appendChild(input);

      const plusBtn = document.createElement("button");
      plusBtn.textContent = "＋";
      plusBtn.style.borderColor = section.accent;
      plusBtn.style.color = section.accent;
      plusBtn.onclick = () => {
        counts[k] = val + 1;
        save();
        render();
      };
      counterDiv.appendChild(plusBtn);

      row.appendChild(counterDiv);
      itemsDiv.appendChild(row);
    });

    sec.appendChild(itemsDiv);
    container.appendChild(sec);
  });
}

document.getElementById("resetBtn").onclick = () => {
  if (window.confirm("本当に全ての個数を0にリセットしますか？この操作は取り消せません。")) {
    counts = {};
    save();
    render();
  }
};

document.getElementById("exportBtn").onclick = () => {
  const lines = [];
  lines.push("在庫数一覧（個人用）");
  lines.push("出力日: " + new Date().toLocaleString("ja-JP"));
  lines.push("");
  SECTIONS.forEach((section) => {
    lines.push("【" + section.title + "】");
    section.items.forEach((item, idx) => {
      const k = keyOf(section.id, item, idx);
      lines.push(item + ": " + (counts[k] || 0));
    });
    lines.push("");
  });
  const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = "在庫数_個人用_" + stamp + ".txt";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

load();
render();
</script>

</body>
</html>
